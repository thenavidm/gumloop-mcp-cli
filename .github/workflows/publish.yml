name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
concurrency:
  group: gumloop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:counts
      - name: Verify tag version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm run build:mcpb
      - name: Check npm version
        id: npm-version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@thenavidm/gumloop-mcp-cli@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create release with desktop extension
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" desktop-extension/*.mcpb --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
